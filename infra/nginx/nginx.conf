worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # Resolve service names from Consul DNS.
        resolver discovery-service valid=5s ipv6=off;

        location /health {
            return 200 "api-gateway ok\n";
            add_header Content-Type text/plain;
        }

        location /api/backend/ {
            set $backend_upstream web.service.consul;
            proxy_pass http://$backend_upstream:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/config/ {
            set $config_upstream config-service.service.consul;
            proxy_pass http://$config_upstream:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/discovery/ {
            proxy_pass http://discovery-service:8500/;
            proxy_set_header Host $host;
        }
    }
}
