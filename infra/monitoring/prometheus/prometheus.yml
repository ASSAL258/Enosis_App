global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  - job_name: service-http-probes
    metrics_path: /probe
    params:
      module: [http_any_status]
    static_configs:
      - targets:
          - http://api-gateway/
          - http://frontend/
          - http://config-service:5000/
          - http://auth-service:5003/
          - http://user-service:5002/
          - http://avance-service:5004/
          - http://conge-service:5008/
          - http://pret-service:5010/
          - http://attestation-service:5011/
          - http://feedback-user:5001/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: rabbitmq-metrics
    static_configs:
      - targets:
          - rabbitmq:15692
