upstream auth_upstream {
  server auth-service:8000;
}

upstream avance_upstream {
  server demande-avance-salaire-service:8000;
}

upstream attestation_upstream {
  server demande-attestation-service:8000;
}

upstream files_upstream {
  server files-service:8000;
}

upstream rib_upstream {
  server demande-rib-service:8000;
}

upstream conge_upstream {
  server demande-conge-service:8000;
}

upstream pret_upstream {
  server demande-pret-service:8000;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 50m;

  root /usr/share/nginx/html;
  index index.html;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  proxy_connect_timeout 30s;
  proxy_send_timeout 90s;
  proxy_read_timeout 90s;

  location /api/token {
    proxy_pass http://auth_upstream;
  }

  location /api/me {
    proxy_pass http://auth_upstream;
  }

  location /api/rh/ {
    proxy_pass http://auth_upstream;
  }

  location /api/admin/sync-users {
    proxy_pass http://auth_upstream;
  }

  location /api/demandes {
    proxy_pass http://avance_upstream;
  }

  location /api/attestations {
    proxy_pass http://attestation_upstream;
  }

  location /api/changement-rib {
    proxy_pass http://rib_upstream;
  }

  location /api/conges {
    proxy_pass http://conge_upstream;
  }

  location /api/prets {
    proxy_pass http://pret_upstream;
  }

  location /api/files {
    proxy_pass http://files_upstream;
  }

  location /api/ {
    proxy_pass http://avance_upstream;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }
}
